name: Velocity Hebrew - Daily Lesson

on:
  schedule:
    - cron: '40 7 * * *'
  workflow_dispatch:
    inputs:
      skip_upload:
        description: 'Build only (skip YouTube + Facebook)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: daily-lesson-hebrew
  cancel-in-progress: false

jobs:
  lesson:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra fonts-noto-cjk fonts-noto-color-emoji
          sudo fc-cache -f

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Credentials
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          AI_MODEL: ${{ vars.AI_MODEL || 'openai/gpt-5.4-nano' }}
        run: |
          : > .env
          printf '%s\n' "POLLINATIONS_API_KEY=$POLLINATIONS_API_KEY" >> .env
          printf '%s\n' "YT_CLIENT_ID=$YT_CLIENT_ID" >> .env
          printf '%s\n' "YT_CLIENT_SECRET=$YT_CLIENT_SECRET" >> .env
          printf '%s\n' "YT_REFRESH_TOKEN=$YT_REFRESH_TOKEN" >> .env
          printf '%s\n' "FACEBOOK_ACCESS_TOKEN=$FACEBOOK_ACCESS_TOKEN" >> .env
          printf '%s\n' "FACEBOOK_PAGE_ID=$FACEBOOK_PAGE_ID" >> .env
          printf '%s\n' "AI_MODEL=${AI_MODEL:-openai/gpt-5.4-nano}" >> .env

      - name: Build lesson
        run: python build.py

      - name: Verify length
        run: |
          python -c "import json,sys; m=json.load(open('output/latest_video.json',encoding='utf-8')); s=float(m['duration_seconds']); print(f'duration: {s/60:.2f} min'); sys.exit('lesson exceeds 15 minutes') if s>900 else None"

      - name: Upload to YouTube
        if: ${{ github.event.inputs.skip_upload != 'true' }}
        run: python upload_to_youtube.py

      - name: Upload to Facebook
        if: ${{ github.event.inputs.skip_upload != 'true' }}
        continue-on-error: true
        run: python upload_to_facebook.py

      - name: Save history
        if: always()
        run: |
          mkdir -p output
          git config user.name "velocity-bot"
          git config user.email "velocity-bot@users.noreply.github.com"
          git add -A output
          git commit -m "lesson: $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git pull --rebase --autostash origin "$(git rev-parse --abbrev-ref HEAD)" || true
          git push || echo "push skipped"

      - name: Cleanup heavy files
        if: always()
        run: rm -rf output/lessons/*/audio output/lessons/*/work output/lessons/*/*.mp4 output/lessons/*/mix.wav
